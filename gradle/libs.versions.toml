[versions]
netty = "4.2.16.Final"
adventure = "5.2.0"
log4j = "2.26.1"
gson = "2.14.0"
nightconfig = "3.9.0"
fastutil = "8.5.15"
caffeine = "3.2.0"
guava = "33.4.8-jre"
junit = "5.11.4"

[libraries]
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-buffer = { module = "io.netty:netty-buffer" }
netty-transport = { module = "io.netty:netty-transport" }
netty-transport-epoll = { module = "io.netty:netty-transport-classes-epoll" }
netty-transport-epoll-native = { module = "io.netty:netty-transport-native-epoll" }
netty-transport-iouring = { module = "io.netty:netty-transport-classes-io_uring" }
netty-transport-iouring-native = { module = "io.netty:netty-transport-native-io_uring" }
netty-codec = { module = "io.netty:netty-codec" }
netty-codec-compression = { module = "io.netty:netty-codec-compression" }
netty-codec-haproxy = { module = "io.netty:netty-codec-haproxy" }
netty-codec-http = { module = "io.netty:netty-codec-http" }
netty-handler = { module = "io.netty:netty-handler" }
netty-resolver-dns = { module = "io.netty:netty-resolver-dns" }

adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }
adventure-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
adventure-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }

log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }

gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
nightconfig-core = { module = "com.electronwill.night-config:core", version.ref = "nightconfig" }
nightconfig-toml = { module = "com.electronwill.night-config:toml", version.ref = "nightconfig" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
netty = [
    "netty-buffer", "netty-transport", "netty-codec", "netty-codec-compression",
    "netty-codec-haproxy", "netty-codec-http", "netty-handler", "netty-resolver-dns",
]
netty-natives = [
    "netty-transport-epoll", "netty-transport-epoll-native",
    "netty-transport-iouring", "netty-transport-iouring-native",
]
adventure = [
    "adventure-api", "adventure-minimessage", "adventure-gson",
    "adventure-legacy", "adventure-plain",
]
