name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 22, 23, 24, 25]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build proxy + API, run all tests
        run: ./gradlew --no-daemon build

      - name: Publish API to local repo
        run: ./gradlew --no-daemon :hypergravel-api:publishToMavenLocal

      - name: Verify sample extension still compiles against the API
        run: ./gradlew --no-daemon -p examples/sample-extension jar

      - name: Upload runnable fat jar (JDK ${{ matrix.java }})
        uses: actions/upload-artifact@v7
        with:
          name: hypergravel-proxy-jdk${{ matrix.java }}
          path: hypergravel-proxy/build/libs/hypergravel-proxy-*-all.jar
          if-no-files-found: error

      - name: Upload sample extension (JDK ${{ matrix.java }})
        uses: actions/upload-artifact@v7
        with:
          name: sample-extension-jdk${{ matrix.java }}
          path: examples/sample-extension/build/libs/sample-extension-*.jar
          if-no-files-found: error

      - name: Upload test results (JDK ${{ matrix.java }})
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-jdk${{ matrix.java }}
          path: |
            hypergravel-api/build/test-results/test/*.xml
            hypergravel-proxy/build/test-results/test/*.xml
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build runnable fat jar
        run: ./gradlew --no-daemon build

      - name: Publish API to GitHub Packages
        run: ./gradlew --no-daemon :hypergravel-api:publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Strip -SNAPSHOT from the fat jar for release
        run: |
          asset=$(ls hypergravel-proxy/build/libs/hypergravel-proxy-*-all.jar)
          mv "$asset" "hypergravel-proxy/build/libs/hypergravel-proxy-${GITHUB_REF_NAME#v}-all.jar"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" \
            hypergravel-proxy/build/libs/hypergravel-proxy-*-all.jar --clobber

  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build runnable fat jar
        run: ./gradlew --no-daemon build

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest

  docs:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Generate API javadoc
        run: ./gradlew --no-daemon :hypergravel-api:javadoc

      - name: Deploy javadoc to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: hypergravel-api/build/docs/javadoc
          publish_branch: gh-pages
          force_orphan: true